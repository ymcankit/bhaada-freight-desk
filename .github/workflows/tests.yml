# Every suite blanks the model keys and stubs the messaging APIs, so no secrets are needed here.
# Each suite exits non-zero on any FAIL, which fails the job.
name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [test_engine, test_server, test_telegram, test_agents, test_llm_paths]
    env:
      GROQ_API_KEY: ""
      OPENAI_API_KEY: ""
      UPSTASH_REDIS_REST_URL: ""
      UPSTASH_REDIS_REST_TOKEN: ""
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: ${{ matrix.suite }}
        run: |
          python ${{ matrix.suite }}.py | tee out.log
          grep -q "ALL PASS" out.log
        shell: bash -o pipefail {0}
